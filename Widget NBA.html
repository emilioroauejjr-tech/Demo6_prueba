<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget NBA</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="contenedor">

        <h1>Widget NBA en HTML</h1>

        <p>
            En esta página he agregado un widget de la NBA utilizando un iframe,
            además de una imagen relacionada para mejorar el diseño.
        </p>

        <!-- IMAGEN -->
        <img 
            src="https://upload.wikimedia.org/wikipedia/en/0/03/National_Basketball_Association_logo.svg" 
            alt="Logo NBA">

        <h2>Resultados NBA en vivo</h2>

        <!-- WIDGET -->
        <div class="widget-nba">
            <iframe 
                src="https://www.espn.com/nba/scoreboard"
                width="100%"
                height="0"
                frameborder="1">
            </iframe>
        </div>

        <button>Ver más deportes</button>

    </div>

</body>
</html>
